# pydocstyle: use the PEP 257 convention. D107 (docstring in __init__) is ignored because
# the class docstring documents construction; D403 because technical names like "CDN" are
# intentionally capitalised; D213 defaults to the PEP 258 style used across the project.
[pydocstyle]
convention = pep257
add-ignore = D107,D203,D213,D403
