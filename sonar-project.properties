sonar.projectKey=brunoanhaia_imobi-scrapper
sonar.projectName=imobi-scrapper
sonar.organization=brunoanhaia

sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Captured third-party markup used as parser fixtures: not our code.
sonar.exclusions=\
  tests/fixtures/**,\
  docs/**,\
  src/imobi/web/static/htmx.min.js,\
  src/imobi/web/static/icons.svg,\
  src/imobi/web/static/placeholder.svg,\
  **/*.png

# Duplicated literals inside fixtures/templates are not worth flags.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:ImgWithoutAltCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/fixtures/**
sonar.issue.ignore.multicriteria.e2.ruleKey=**
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/fixtures/**
