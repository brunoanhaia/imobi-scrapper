# Works with docker compose and podman-compose.
# Postgres is the source of truth; the app container holds only code.
# Values come from `.env` (copy from `.env.example`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Only for local development (running `imovel serve` outside the container).
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    image: imovel-scrapper:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      CRITERIA_MIN_PRICE: ${CRITERIA_MIN_PRICE}
      CRITERIA_MAX_PRICE: ${CRITERIA_MAX_PRICE}
      RATE_LIMIT_SECONDS: ${RATE_LIMIT_SECONDS}
      MAX_PAGES_PER_SOURCE: ${MAX_PAGES_PER_SOURCE}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      IMAGES_CACHE_DIR: /app/.cache/img
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - db
    restart: unless-stopped

  # Daily database backup into ./backups (pg_dump custom format, pruned to BACKUP_KEEP).
  # Runs as root because the bind mount belongs to the host user; the dump itself is harmless.
  backup:
    image: imovel-scrapper:latest
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS}
      TZ: ${TZ}
    volumes:
      - ./backups:/backups
    user: "0"
    command:
      - sh
      - -c
      - while true; do imovel backup || true; sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"; done
    depends_on:
      - db
    restart: unless-stopped

  # Scheduled collector: seeds on start, then scrapes every SCRAPE_INTERVAL_SECONDS.
  scraper:
    image: imovel-scrapper:latest
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CRITERIA_MIN_PRICE: ${CRITERIA_MIN_PRICE}
      CRITERIA_MAX_PRICE: ${CRITERIA_MAX_PRICE}
      RATE_LIMIT_SECONDS: ${RATE_LIMIT_SECONDS}
      MAX_PAGES_PER_SOURCE: ${MAX_PAGES_PER_SOURCE}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
    command:
      - sh
      - -c
      - imovel seed && while true; do imovel scrape || true; imovel check-links --limit 30 || true; sleep "$${SCRAPE_INTERVAL_SECONDS:-21600}"; done
    depends_on:
      - db
    restart: unless-stopped
