# Works with docker compose and podman-compose.
# Postgres is the source of truth; the app container holds only code.
# Values come from `.env` (copy from `.env.example`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    image: imovel-scrapper:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      CRITERIA_MIN_PRICE: ${CRITERIA_MIN_PRICE}
      CRITERIA_MAX_PRICE: ${CRITERIA_MAX_PRICE}
      RATE_LIMIT_SECONDS: ${RATE_LIMIT_SECONDS}
      MAX_PAGES_PER_SOURCE: ${MAX_PAGES_PER_SOURCE}
      IMAGES_CACHE_MAX_MB: ${IMAGES_CACHE_MAX_MB}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped

  # Scheduled collector: seeds on start, then scrapes every SCRAPE_INTERVAL_SECONDS.
  scraper:
    image: imovel-scrapper:latest
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CRITERIA_MIN_PRICE: ${CRITERIA_MIN_PRICE}
      CRITERIA_MAX_PRICE: ${CRITERIA_MAX_PRICE}
      RATE_LIMIT_SECONDS: ${RATE_LIMIT_SECONDS}
      MAX_PAGES_PER_SOURCE: ${MAX_PAGES_PER_SOURCE}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
    command:
      - sh
      - -c
      - imovel seed && while true; do imovel scrape || true; sleep "$${SCRAPE_INTERVAL_SECONDS:-21600}"; done
    depends_on:
      - db
    restart: unless-stopped
