name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Ruff & Pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies (wheels only)
        run: |
          python -m pip install --only-binary :all: --upgrade "pip==26.3"
          pip install --only-binary :all: \
            alembic==1.20.1 \
            brotli==1.2.1 \
            fastapi==0.165.0 \
            httpx==0.28.1 \
            itsdangerous==2.2.0 \
            jinja2==3.1.6 \
            playwright==1.65.2 \
            "psycopg[binary]==3.3.9" \
            pydantic-settings==2.16.3 \
            pydantic==2.14.3 \
            python-multipart==0.0.34 \
            selectolax==1.0.2 \
            sqladmin==0.32.0 \
            "sqlalchemy[asyncio]==2.1.9" \
            tenacity==9.2.1 \
            typer==0.29.2 \
            "uvicorn[standard]==0.54.0" \
            "setuptools==84.2.1" \
            pytest==9.2.0 \
            ruff==0.17.5
          pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/wheels .
          pip install --only-binary :all: --no-deps /tmp/wheels/imovel_scrapper-*.whl
          rm -rf /tmp/wheels

      - name: Run Ruff lint
        run: ruff check .

      - name: Run offline test suite
        run: pytest -q
