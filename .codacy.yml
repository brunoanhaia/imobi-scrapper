---
exclude_paths:
  - "tests/fixtures/**"
  - "docs/**"
  - "src/imovel/web/static/htmx.min.js"
  - "src/imovel/web/static/icons.svg"
  - "src/imovel/web/static/placeholder.svg"
  - "backups/**"
  - "data/**"

# Complexity is already enforced by Sonar (threshold 15, every function passes).
# Running a second tool with a stricter threshold only reports the same functions twice.
engines:
  lizard:
    enabled: false
