# Docker Compose stack managed by Dockhand (pulls prebuilt GHCR image).
# Secrets come from Dockhand Secrets or the stack environment (see deploy/.env.example).
name: imobi

x-app: &app
  image: "ghcr.io/brunoanhaia/imobi-scrapper:${IMOBI_VERSION:-latest}"
  restart: unless-stopped
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: imobi-db
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-imobi}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-imobi}"
    volumes:
      - imobi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imobi} -d ${POSTGRES_DB:-imobi}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - imobi_db

  app:
    <<: *app
    container_name: imobi-app
    pids_limit: 128
    mem_limit: 512m
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-imobi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imobi}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}"
      ADMIN_SECRET_KEY: "${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY}"
      CRITERIA_MIN_PRICE: "${CRITERIA_MIN_PRICE:-100000}"
      CRITERIA_MAX_PRICE: "${CRITERIA_MAX_PRICE:-600000}"
      RATE_LIMIT_SECONDS: "${RATE_LIMIT_SECONDS:-3.0}"
      MAX_PAGES_PER_SOURCE: "${MAX_PAGES_PER_SOURCE:-90}"
      TZ: "${TZ:-America/Sao_Paulo}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      STATE_DIR: /app/data
      BACKUP_DIR: /app/data/backups
      BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
      BACKUP_MAX_UPLOAD_MB: "${BACKUP_MAX_UPLOAD_MB:-512}"
      BACKUP_TIMEOUT_SECONDS: "${BACKUP_TIMEOUT_SECONDS:-300}"
      IMAGES_CACHE_DIR: /app/data/img-cache
      IMAGES_CACHE_MAX_MB: "${IMAGES_CACHE_MAX_MB:-2048}"
      IMAGES_MAX_BYTES: "${IMAGES_MAX_BYTES:-8388608}"
      IMAGES_NEGATIVE_TTL_SECONDS: "${IMAGES_NEGATIVE_TTL_SECONDS:-86400}"
      SESSION_HTTPS_ONLY: "${SESSION_HTTPS_ONLY:-true}"
      ALLOWED_HOSTS: "${APP_DOMAIN:?Set APP_DOMAIN}"
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - imobi_state:/app/data:U
    depends_on:
      db:
        condition: service_healthy
    networks:
      imobi_db: {}
      traefik:
        aliases:
          - imobi
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.imobi.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN}`)"
      - "traefik.http.routers.imobi.entrypoints=websecure"
      - "traefik.http.routers.imobi.tls=true"
      - "traefik.http.routers.imobi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.imobi.middlewares=${TRAEFIK_MIDDLEWARES:-security-headers@file,tinyauth@file}"
      - "traefik.http.services.imobi.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  scraper:
    <<: *app
    container_name: imobi-scraper
    pids_limit: 256
    mem_limit: 1536m
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-imobi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-imobi}"
      CRITERIA_MIN_PRICE: "${CRITERIA_MIN_PRICE:-100000}"
      CRITERIA_MAX_PRICE: "${CRITERIA_MAX_PRICE:-600000}"
      RATE_LIMIT_SECONDS: "${RATE_LIMIT_SECONDS:-3.0}"
      MAX_PAGES_PER_SOURCE: "${MAX_PAGES_PER_SOURCE:-90}"
      SCRAPE_INTERVAL_SECONDS: "${SCRAPE_INTERVAL_SECONDS:-21600}"
      TZ: "${TZ:-America/Sao_Paulo}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      STATE_DIR: /app/data
    volumes:
      - imobi_state:/app/data:U
    depends_on:
      db:
        condition: service_healthy
    networks:
      - imobi_db
      - imobi_egress
    command:
      - sh
      - -c
      - |
        set -eu
        while [ -f "$${STATE_DIR:-/app/data}/maintenance" ]; do
          sleep 30
        done
        imobi seed
        while true; do
          if [ -f "$${STATE_DIR:-/app/data}/maintenance" ]; then
            sleep 30
            continue
          fi
          imobi scrape || true
          imobi check-links --limit 30 || true
          sleep "$${SCRAPE_INTERVAL_SECONDS:-21600}"
        done

volumes:
  imobi_pgdata:
    name: imobi_pgdata
  imobi_state:
    name: imobi_state

networks:
  imobi_db:
    internal: true
  imobi_egress: {}
  traefik:
    external: true
