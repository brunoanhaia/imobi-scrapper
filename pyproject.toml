[project]
name = "imobi-scrapper"
version = "0.2.0"
description = "Aggregate for-sale real estate listings in Rio Claro/SP from portals and local agencies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "alembic==1.20.1",
    "brotli==1.2.1",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "playwright==1.65.2",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "selectolax==1.0.2",
    "sqladmin==0.32.0",
    "sqlalchemy[asyncio]==2.1.9",
    "tenacity==9.2.1",
    "typer==0.29.2",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[project.scripts]
imobi = "imobi.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imobi = [
    "web/templates/*.html",
    "web/templates/partials/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that hit the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's public API is built on function calls in argument defaults.
"src/imobi/cli.py" = ["B008"]
