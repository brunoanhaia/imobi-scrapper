[project]
name = "imovel-scrapper"
version = "0.1.0"
description = "Aggregate for-sale real estate listings in Rio Claro/SP from portals and local agencies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "brotli>=1.1",
    "playwright>=1.49",
    "alembic>=1.13",
    "selectolax>=0.3.21",
    "typer>=0.13",
    "tenacity>=9.0",
    "sqladmin>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
imovel = "imovel.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imovel = [
    "web/templates/*.html",
    "web/templates/partials/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that hit the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's public API is built on function calls in argument defaults.
"src/imovel/cli.py" = ["B008"]
