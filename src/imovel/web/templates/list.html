{% extends "base.html" %}

{% block content %}
<div class="page-head">
  <div class="head-row">
    <h1>{{ title }} <span class="count">{{ total }}</span></h1>
    <a class="icon-btn" href="/deck?{{ query }}" title="Modo deck" aria-label="Modo deck">
      <svg class="icon"><use href="/static/icons.svg#deck"></use></svg>
    </a>
    <details class="export-menu">
      <summary class="icon-btn" title="Exportar" aria-label="Exportar">
        <svg class="icon"><use href="/static/icons.svg#download"></use></svg>
      </summary>
      <div class="export-options">
        <a href="/export.csv?{{ query }}{% if query %}&{% endif %}scope={{ export_scope }}">CSV (todos os campos)</a>
        <a href="/export.json?{{ query }}{% if query %}&{% endif %}scope={{ export_scope }}">JSON (todos os campos)</a>
      </div>
    </details>
    <div class="sort">
      <svg class="icon"><use href="/static/icons.svg#sort"></use></svg>
      <a href="?{{ query }}{% if query %}&{% endif %}sort=recent" class="{% if sort == 'recent' %}active{% endif %}">novos</a>
      <a href="?{{ query }}{% if query %}&{% endif %}sort=price" class="{% if sort == 'price' %}active{% endif %}">preço</a>
      <a href="?{{ query }}{% if query %}&{% endif %}sort=ppm2" class="{% if sort == 'ppm2' %}active{% endif %}">R$/m²</a>
    </div>
  </div>
  {% include "partials/filters.html" %}
</div>

<div id="cards" class="cards">
  {% include "partials/cards.html" %}
</div>
{% endblock %}
