<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}{{ title or "Imóveis" }}{% endblock %} · Rio Claro</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/ui.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/novos">Imóveis Rio Claro</a>
    {% if request.session.get('authenticated') %}
      <a class="link" href="/backup">backup</a>
    {% endif %}
    <a class="link" href="/logout">sair</a>
  </header>

  <p id="offline-banner" class="offline-banner" hidden>
    Sem conexão — as decisões ficam guardadas e são enviadas quando a rede voltar.
  </p>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <nav class="tabbar">
    <a href="/novos" class="tabbar-link{% if mode in ['novos', 'deck'] %} active{% endif %}">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#list"></use></svg> Novos
    </a>
    <a href="/interessados" class="tabbar-link{% if mode == 'yes' %} active{% endif %}">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#yes"></use></svg> Interessados
    </a>
    <a href="/talvez" class="tabbar-link{% if mode == 'maybe' %} active{% endif %}">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#maybe"></use></svg> Talvez
    </a>
  </nav>

  <div id="toast" class="toast" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
